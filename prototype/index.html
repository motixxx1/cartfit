<title>CartFit · סל-פיקס</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700;800&family=Rubik:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: single phone-width app shell — sticky header, scrolling view, fixed tab bar. */
:root{
  --bg:#F3F6F4; --surface:#FFFFFF; --surface-2:#F8FAF9; --line:#E3E9E6;
  --ink:#0F172A; --ink-soft:#44546A; --muted:#75859A;
  --brand:#10B981; --brand-deep:#047857; --brand-wash:#E7F7F0;
  --accent:#F59E0B; --accent-wash:#FDF2DC; --danger:#DC2626; --danger-wash:#FDECEC;
  --indigo:#6366F1; --pink:#EC4899; --slate:#64748B;
  --display:"Rubik","Heebo",system-ui,sans-serif;
  --body:"Heebo","Rubik",system-ui,sans-serif;
  --shadow:0 1px 2px rgba(15,23,42,.05), 0 10px 28px -16px rgba(15,23,42,.25);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0B1220; --surface:#131D2C; --surface-2:#0F1826; --line:#243348;
  --ink:#E8EEF6; --ink-soft:#B7C4D4; --muted:#8A9AAF;
  --brand:#34D399; --brand-deep:#6EE7B7; --brand-wash:#0E2B24;
  --accent:#FBBF24; --accent-wash:#33270B; --danger:#F87171; --danger-wash:#331717;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 12px 30px -18px rgba(0,0,0,.8);
  color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#0B1220; --surface:#131D2C; --surface-2:#0F1826; --line:#243348;
  --ink:#E8EEF6; --ink-soft:#B7C4D4; --muted:#8A9AAF;
  --brand:#34D399; --brand-deep:#6EE7B7; --brand-wash:#0E2B24;
  --accent:#FBBF24; --accent-wash:#33270B; --danger:#F87171; --danger-wash:#331717;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 12px 30px -18px rgba(0,0,0,.8);
  color-scheme:dark; }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);direction:rtl;margin:0;
     font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0}
button{font-family:inherit;color:inherit;cursor:pointer}
input,textarea,select{font-family:inherit;font-size:15px}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:8px}

.shell{max-width:520px;margin:0 auto;padding:0 16px 104px;min-height:100%}
.appbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);
        backdrop-filter:blur(10px);padding-block:12px 8px;margin:0 -16px;padding-inline:16px;border-bottom:1px solid transparent}
.appbar.stuck{border-bottom-color:var(--line)}
.brandline{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.brandline h1{font-size:21px;font-weight:700;letter-spacing:-.3px}
.brandline h1 span{color:var(--brand)}
.sub{color:var(--muted);font-size:12.5px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}
.pad{padding:16px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.spread{display:flex;align-items:center;justify-content:space-between;gap:10px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.num{font-variant-numeric:tabular-nums;font-family:var(--display)}
.muted{color:var(--muted)}
.small{font-size:12px}
.tiny{font-size:11px}
.hr{height:1px;background:var(--line);margin:4px 0}

.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);
      border-radius:999px;padding:7px 12px;font-size:13px;color:var(--ink-soft);transition:.15s}
.chip:hover{border-color:var(--muted)}
.chip.on{border-color:var(--brand);background:var(--brand-wash);color:var(--brand-deep);font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;
     border-radius:14px;padding:13px 16px;font-weight:700;font-size:15px;transition:transform .12s,background .15s}
.btn:active{transform:scale(.985)}
.btn-primary{background:var(--brand);color:#04291F;box-shadow:0 8px 20px -10px color-mix(in srgb,var(--brand) 80%,transparent)}
.btn-primary:hover{background:var(--brand-deep);color:#fff}
.btn-ghost{background:var(--surface);border-color:var(--line);color:var(--ink)}
.btn-full{width:100%}
.tag{display:inline-flex;align-items:center;gap:4px;border-radius:8px;padding:2px 7px;font-size:11px;font-weight:600}
.tag-promo{background:var(--accent-wash);color:var(--accent)}
.tag-warn{background:var(--danger-wash);color:var(--danger)}
.tag-bundle{background:color-mix(in srgb,var(--indigo) 14%,transparent);color:var(--indigo)}
.tag-soft{background:var(--surface-2);color:var(--muted)}
.tag-brand{background:var(--brand-wash);color:var(--brand-deep)}

/* budget slider */
.slider{-webkit-appearance:none;appearance:none;width:100%;height:8px;border-radius:999px;outline:none;margin:6px 0 0}
.slider::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;border-radius:50%;background:var(--surface);
  border:4px solid var(--brand);box-shadow:0 4px 14px -4px color-mix(in srgb,var(--brand) 70%,transparent);cursor:grab}
.slider::-moz-range-thumb{width:26px;height:26px;border-radius:50%;background:var(--surface);border:4px solid var(--brand);cursor:grab}
.bignum{font-family:var(--display);font-size:44px;font-weight:700;letter-spacing:-1.5px;line-height:1}

.storecard{min-width:120px;display:flex;flex-direction:column;gap:4px;align-items:flex-start;
           border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:10px;text-align:right}
.storecard.on{border-color:var(--brand);background:var(--brand-wash)}
.logo{width:28px;height:28px;border-radius:9px;color:#fff;font:700 11px/28px var(--display);text-align:center}
.scroll-x{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}

.item{display:flex;gap:10px;padding:12px;border:1px solid var(--line);background:var(--surface);border-radius:16px}
.item.locked{border-color:color-mix(in srgb,var(--brand) 55%,var(--line))}
.catbar{width:5px;border-radius:999px;flex:0 0 5px}
.item-main{min-width:0;flex:1}
.item-name{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qty{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:10px;padding:2px}
.qty button{border:0;background:transparent;padding:3px 6px;border-radius:7px;line-height:1}
.qty button:hover{background:var(--surface-2)}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:5px 8px;font-size:12px;color:var(--ink-soft)}
.iconbtn.on{border-color:var(--brand);background:var(--brand-wash);color:var(--brand-deep)}

.progress{height:10px;border-radius:999px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line)}
.progress > div{height:100%;border-radius:999px;transition:width .45s cubic-bezier(.2,.7,.3,1)}

.tabbar{position:fixed;inset-inline:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--surface) 95%,transparent);
        backdrop-filter:blur(12px);border-top:1px solid var(--line);
        padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.tabbar .inner{max-width:520px;margin:0 auto;display:flex}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:0;
     padding:7px 2px;font-size:11px;color:var(--muted);border-radius:12px}
.tab.on{color:var(--brand-deep);font-weight:700;background:var(--brand-wash)}
.tab svg{width:20px;height:20px}

.banner{border-radius:14px;padding:10px 12px;font-size:12.5px}
.banner-accent{background:var(--accent-wash);color:var(--accent)}
.banner-brand{background:var(--brand-wash);color:var(--brand-deep)}
.banner-danger{background:var(--danger-wash);color:var(--danger)}

.hero{border-radius:18px;padding:18px}
.hero-green{background:linear-gradient(235deg,#10B981,#059669);color:#ECFDF5}
.hero-amber{background:linear-gradient(235deg,#F59E0B,#D97706);color:#431407}

.steps-line{display:flex;gap:8px;align-items:flex-start}
.stepnum{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;
         justify-content:center;font:700 12px var(--display);color:var(--muted);flex:0 0 28px;background:var(--surface)}
.stepnum.done{background:var(--brand);border-color:var(--brand);color:#04291F}

textarea,input[type=text]{width:100%;background:var(--surface);color:var(--ink);border:1px solid var(--line);
  border-radius:12px;padding:10px 12px}
textarea:focus,input[type=text]:focus{outline:none;border-color:var(--brand)}
code{font-family:ui-monospace,Menlo,monospace;background:var(--surface-2);padding:1px 6px;border-radius:6px;font-size:12px}
.switch{position:relative;width:44px;height:26px;flex:0 0 44px;border-radius:999px;background:var(--line);transition:.2s;border:0}
.switch.on{background:var(--brand)}
.switch::after{content:"";position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
.switch.on::after{right:21px}
.note{font-size:11px;color:var(--muted)}
.checkline{display:flex;align-items:center;gap:10px;padding:11px 12px;border:1px solid var(--line);
           background:var(--surface);border-radius:14px;width:100%;text-align:right}
.checkline.done{opacity:.5}
.checkline.done .item-name{text-decoration:line-through}
.box{width:24px;height:24px;border:2px solid var(--line);border-radius:7px;display:flex;align-items:center;
     justify-content:center;flex:0 0 24px}
.box.on{background:var(--brand);border-color:var(--brand);color:#04291F}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="shell">
  <header class="appbar" id="appbar">
    <div class="brandline">
      <h1>CartFit <span>· סל-פיקס</span></h1>
      <button class="chip" id="themeBtn" title="מצב תצוגה">🌓</button>
    </div>
    <p class="sub" id="subtitle">סל קניות שנבנה בדיוק לפי התקציב שלך</p>
  </header>

  <main id="view" class="stack" style="padding-block:14px"></main>
</div>

<nav class="tabbar">
  <div class="inner" id="tabs"></div>
</nav>

<script src="data.js"></script>
<script src="engine.js"></script>
<script src="app.js"></script>
