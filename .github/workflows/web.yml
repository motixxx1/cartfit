# Builds the website and publishes it to GitHub Pages.
#
# The site is the same client as the app and is equally self-contained: with no
# NEXT_PUBLIC_API_URL it computes everything in the browser. Point the variable
# at a deployed API (Settings → Variables → CARTFIT_API_URL) to use live prices.
name: Website

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/web.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Build the static site
        env:
          # Project pages are served from /<repo>, so the asset paths need the prefix.
          NEXT_BASE_PATH: /${{ github.event.repository.name }}
          NEXT_PUBLIC_API_URL: ${{ vars.CARTFIT_API_URL }}
          NEXT_PUBLIC_BUILD_TARGET: web
        run: |
          npm run build
          touch out/.nojekyll          # keep Pages from hiding the _next directory
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
