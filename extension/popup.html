<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <style>
    body { font-family: Heebo, system-ui, sans-serif; width: 300px; margin: 0; padding: 16px; color: #0F172A; }
    h1 { font-size: 15px; margin: 0 0 4px; }
    p { font-size: 12px; color: #64748B; margin: 0 0 12px; }
    input, button { width: 100%; box-sizing: border-box; font-family: inherit; }
    input { padding: 10px; border: 1px solid #E2E8F0; border-radius: 10px; margin-bottom: 8px; }
    button { padding: 11px; border: 0; border-radius: 10px; background: #10B981; color: #fff; font-weight: 700; cursor: pointer; }
    #status { font-size: 12px; margin-top: 10px; color: #059669; }
  </style>
</head>
<body>
  <h1>CartFit · הזרקת סל</h1>
  <p>הדבק את קוד השיתוף מהאפליקציה (למשל AC5DRK) והסל ייטען לעגלה באתר הרשת.</p>
  <input id="code" placeholder="קוד סל" maxlength="8" />
  <button id="go">טען את הסל לעגלה</button>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
